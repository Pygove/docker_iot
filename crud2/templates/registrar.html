{% extends "layout.html" %}
{% block body %}
<div class="form-container">
  <p class="title">Registrarse</p>
  <form class="form" method="POST" action="{{url_for('registrar')}}">
    <div class="input-group">
      <label for="usuario">Usuario</label>
      <input autofocus name="usuario" id="usuario" placeholder="veron456" type="text" required>
    </div>
    <div class="input-group">
      <label for="password">Contraseña</label>
      <input name="password" id="password" placeholder="loquevosquieras" type="password" required>
    </div>
    <button class="sign" type="submit">Aceptar</button>
  </form>
</div>
{% endblock %}
